version: '3.8'

services:
  kyivstream-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyivstream_agent
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=KyivStrm11111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDIT_EMAIL_RECIPIENT=${AUDIT_EMAIL_RECIPIENT}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3