version: '3.8'

services:
  volia-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volia-orchestrator
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_HTTP=https://api.devnet.solana.com
      - SOLANA_RPC_WS=wss://api.devnet.solana.com
      - PROGRAM_ID=VoL1A5cRkQ7P882u4v4RkU5tEwS9oMwJzPqmTYxU7kY
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - ENTERPRISE_AUDIT_EMAIL=kyiv-demo-auditor@volia.network
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3