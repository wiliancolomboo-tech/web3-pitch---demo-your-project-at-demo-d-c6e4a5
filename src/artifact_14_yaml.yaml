version: '3.8'

services:
  volia-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volia_grid_daemon
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=VoL1A11111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY:-re_mock_test_key}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://api.example.com/webhooks/alerts/placeholder
      - ALERT_EMAIL=command@volia-grid.kyiv.ua
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"