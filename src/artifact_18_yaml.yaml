version: '3.8'

services:
  kredostream-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kredostream-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDIT_WEBHOOK_URL=${AUDIT_WEBHOOK_URL}
      - PROGRAM_ID=Kredox1111111111111111111111111111111111111
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"