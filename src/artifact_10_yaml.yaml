version: "3.8"

services:
  kyiv-stream-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyiv-stream-telemetry-engine
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_AUDIT_EMAIL=${NOTIFICATION_AUDIT_EMAIL:-cfo@enterprise.ua}
      - OPS_WEBHOOK_URL=${OPS_WEBHOOK_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"