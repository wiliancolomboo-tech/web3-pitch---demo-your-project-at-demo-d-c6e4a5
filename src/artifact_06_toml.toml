[toolchain]
anchor_version = "0.29.0"
solana_version = "1.17.0"

[features]
seeds = true
skip-lint = false

[programs.localnet]
kyiv_core = "Ky1vCore11111111111111111111111111111111111"

[programs.devnet]
kyiv_core = "Ky1vCore11111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
worker = "ts-node client/kyiv_core_worker.ts"